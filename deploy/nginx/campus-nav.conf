# nginx reverse proxy for the Campus Navigation deployment.
#
# Routes:
#   /api/* and /media/*  →  api:8000
#   /                    →  admin:3000
#
# Both the API and the admin site are internal-only containers; nginx
# is the only thing listening on public ports.

upstream api_backend {
    server api:8000;
}

upstream admin_frontend {
    server admin:3000;
}

server {
    listen 80;
    server_name _;

    # For a production deployment, terminate TLS here. See the
    # docs/deployment.md file for the certbot setup. For now, plain
    # HTTP works for a closed-network pilot.

    client_max_body_size 20M;

    # API requests go to the FastAPI container.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media files go to the API's static mount.
    location /media/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media is cache-friendly.
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # Everything else goes to the admin site.
    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js uses WebSockets for hot reload in development;
        # in production this is harmless.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}